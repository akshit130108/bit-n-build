services:
  # EcoSentinel Person 3 Reasoning Pipeline Backend
  - type: web
    name: ecosentinel-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: GFW_API_TOKEN
        sync: false # Set in Render dashboard if you have an API key

  # EcoSentinel Person 4 Command Dashboard Frontend
  - type: web
    name: ecosentinel-dashboard
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ecosentinel-backend
          property: host
